<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업무 현황 · 온마을 시설관리</title>
<link rel="stylesheet" th:href="@{/resources/app.css}">
</head>
<body>
<header th:replace="~{fragments/common :: header}">
</header>
<main>
<div class="eyebrow">ONMAEUL · COMMUNITY SPACE</div>
<h1>업무 현황</h1>
<div class="toolbar">
<p class="lead">진행 중인 시설 사용 신청을 확인하세요.</p>
<a class="button" th:if="${actor.role == 'APPLICANT'}" th:href="@{/bookings/new}">+ 사용 신청</a>
</div>
<section class="stats" aria-label="신청 집계">
<article>
<span>전체 신청</span>
<strong th:text="${total}">
</strong>
<small>조회 권한 기준</small>
</article>
<article>
<span>승인 대기</span>
<strong th:text="${pending}">
</strong>
<small>담당자 검토 필요</small>
</article>
<article>
<span>승인 완료</span>
<strong th:text="${approved}">
</strong>
<small>사용 일정 확정</small>
</article>
</section>
<section class="panel">
<div class="toolbar">
<h2>최근 신청</h2>
<a th:href="@{/bookings}">전체 보기 →</a>
</div>
<div class="table-wrap">
<table th:replace="~{fragments/common :: bookingTable}">
</table>
</div>
</section>
</main>
<footer>온마을 시설관리 · SIStack 실습용 가상 기관 · 합성 데이터</footer>
</body>
</html>
