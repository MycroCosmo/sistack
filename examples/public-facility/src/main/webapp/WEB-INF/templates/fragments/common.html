<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
<a class="brand" th:href="@{/dashboard}">
<span class="brand-mark">온</span> 온마을 <small>시설관리</small>
</a>
<nav aria-label="주 메뉴" th:if="${session.actor != null}">
<a th:href="@{/dashboard}">업무 현황</a>
<a th:href="@{/facilities}">시설 안내</a>
<a th:href="@{/bookings}">신청 관리</a>
</nav>
<div class="identity" th:if="${session.actor != null}">
<span th:text="${session.actor.id}">
</span>
<form method="post" th:action="@{/auth/logout}">
<input type="hidden" name="csrf" th:value="${session.csrf}">
<button class="quiet" type="submit">로그아웃</button>
</form>
</div>
</header>
<table th:fragment="bookingTable">
<thead>
<tr>
<th>신청번호</th>
<th>시설 / 사용 목적</th>
<th>사용일</th>
<th>시간</th>
<th>신청자</th>
<th>상태</th>
</tr>
</thead>
<tbody>
<tr th:each="item : ${bookings}">
<td th:text="${'#' + item.id}">
</td>
<td>
<a th:href="@{/bookings/{id}(id=${item.id})}" th:text="${item.facilityName}">
</a>
<small class="sub" th:text="${item.purpose}">
</small>
</td>
<td th:text="${item.useDate}">
</td>
<td th:text="${item.startTime + '–' + item.endTime}">
</td>
<td th:text="${item.applicant}">
</td>
<td>
<span class="badge" th:classappend="${item.status}" th:text="${states[item.status]}">
</span>
</td>
</tr>
<tr th:if="${#lists.isEmpty(bookings)}">
<td colspan="6" class="empty">조건에 맞는 신청이 없습니다.</td>
</tr>
</tbody>
</table>
</body>
</html>
