<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>함께 쓰는 공간, 함께 만드는 일상 · 온마을 시설관리</title>
<link rel="stylesheet" th:href="@{/resources/style.css}">
</head>
<body>
<header th:replace="~{fragments/common :: header}">
</header>
<main>
<p class="eyebrow">ONMAEUL / PUBLIC FACILITIES</p>
<h1>함께 쓰는 공간, 함께 만드는 일상</h1>
<p class="lead">시설을 고르고 사용을 신청하세요. 담당자는 신청 내역을 검토하고 승인합니다.</p>
<div class="login-grid">
<section class="hero">
<span>COMMUNITY SPACE</span>
<h2>신청부터 승인까지<br>차곡차곡 남는 업무.</h2>
<p>시민교육실 / 다목적 회의실 / 동아리 연습실</p>
<div class="blocks" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
</section>
<section class="panel">
<h2>실습 계정 선택</h2>
<p class="muted">비밀번호 없이 합성 계정의 역할로 들어갑니다.</p>
<form id="login-form" method="post" th:action="@{/login}">
<input type="hidden" name="csrf" th:value="${session.csrf}">
<label for="user">계정</label>
<select id="user" name="user">
<option value="applicant">신청자 · applicant</option>
<option value="neighbor">다른 신청자 · neighbor</option>
<option value="reviewer">대관 담당자 · reviewer</option>
<option value="admin">시설 관리자 · admin</option>
</select>
<button id="login-submit">업무 시작하기 →</button>
</form>
<p class="note">실습 데이터는 이 PC의 파일 DB에 저장되며 재시작해도 유지됩니다.</p>
</section>
</div>
</main>
<footer>온마을 시설관리 · 가상 기관의 로컬 실습 서비스</footer>
</body>
</html>
