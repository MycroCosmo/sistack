<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 동네 공간을 함께 쓰는 방법 · 온마을 시설관리</title>
<link rel="stylesheet" th:href="@{/resources/app.css}">
</head>
<body>
<header th:replace="~{fragments/common :: header}">
</header>
<main>
<div class="eyebrow">ONMAEUL · COMMUNITY SPACE</div>
<h1>우리 동네 공간을 함께 쓰는 방법</h1>
<p class="lead">시설을 살펴보고 사용을 신청하세요. 담당자는 접수부터 승인까지 한곳에서 처리합니다.</p>
<div class="login-grid">
<section class="hero">
<span class="tag">PUBLIC FACILITY PORTAL</span>
<h2>신청부터 승인까지,<br>한눈에 이어지는 업무.</h2>
<p>시민교육실 · 다목적 회의실 · 동아리 연습실</p>
<div class="hero-art" aria-hidden="true">
<i>
</i>
<i>
</i>
<i>
</i>
</div>
</section>
<section class="panel">
<h2>실습 계정 선택</h2>
<p class="muted">로컬 실습용입니다. 비밀번호 없이 역할을 선택합니다.</p>
<form id="login-form" method="post" th:action="@{/auth/login}">
<input type="hidden" name="csrf" th:value="${session.csrf}">
<label for="account">계정</label>
<select id="account" name="account">
<option value="applicant">신청자 · applicant</option>
<option value="neighbor">다른 신청자 · neighbor</option>
<option value="reviewer">대관 담당자 · reviewer</option>
<option value="admin">시설 관리자 · admin</option>
</select>
<button id="login-submit" type="submit">업무 시작하기 →</button>
</form>
<p class="note">신청자는 본인 내역만 조회합니다. 담당자는 전체 신청을 심사합니다.</p>
</section>
</div>
</main>
<footer>온마을 시설관리 · SIStack 실습용 가상 기관 · 합성 데이터</footer>
</body>
</html>
