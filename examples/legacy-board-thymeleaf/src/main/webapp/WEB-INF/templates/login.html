<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head><title>로컬 게시판 로그인</title></head>
<body>
    <section layout:fragment="content">
        <h1>레거시 게시판</h1>
        <p>합성 데이터와 역할 선택을 사용하는 로컬 테스트베드입니다. 운영 용도가 아닙니다.</p>
        <form method="post" th:action="@{/auth/login.do}">
            <input type="hidden" name="csrf" th:value="${session.csrf}">
            <label>테스트 역할
                <select name="role">
                    <option value="READER">조회자</option>
                    <option value="ADMIN">관리자</option>
                </select>
            </label>
            <button>입장</button>
        </form>
    </section>
</body>
</html>
