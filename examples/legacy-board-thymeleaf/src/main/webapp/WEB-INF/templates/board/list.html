<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head><title>게시판 목록</title></head>
<body>
    <section layout:fragment="content">
        <h1>게시판 목록</h1>
        <p><span th:text="${viewer}"></span>님</p>
        <form id="searchForm" method="get" th:action="@{/board/list.do}">
            <input type="hidden" name="page" th:value="${search.page}">
            <label>검색 조건
                <select name="searchType">
                    <option value="title" th:selected="${search.searchType == 'title'}">제목</option>
                    <option value="author" th:selected="${search.searchType == 'author'}">작성자</option>
                </select>
            </label>
            <label>검색어 <input name="keyword" maxlength="100" th:value="${search.keyword}"></label>
            <label>시작일 <input type="date" name="startDate" th:value="${search.startDate}"></label>
            <label>종료일 <input type="date" name="endDate" th:value="${search.endDate}"></label>
            <label>정렬
                <select name="sort">
                    <option value="createdAt" th:selected="${search.sort == 'createdAt'}">등록일</option>
                    <option value="title" th:selected="${search.sort == 'title'}">제목</option>
                </select>
            </label>
            <button type="submit">검색</button>
        </form>
        <table>
            <thead><tr><th>번호</th><th>제목</th><th>작성자</th><th>등록일</th></tr></thead>
            <tbody>
                <tr th:each="item : ${boards}">
                    <td th:text="${item.id}"></td>
                    <td><a th:href="@{/board/detail.do(id=${item.id})}" th:text="${item.title}"></a></td>
                    <td th:text="${item.author}"></td>
                    <td th:text="${item.createdAt}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(boards)}"><td colspan="4">조회 결과가 없습니다.</td></tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/common :: paging}"></div>
        <div th:if="${session.loginUser.role == 'ADMIN'}">
            <a th:href="@{/board/form.do}">새 글 등록</a>
            <button id="loadCategories" type="button" th:data-url="@{/code/listJson.do(page=1)}">분류 조회</button>
            <button id="refreshCategories" type="button" th:attr="data-url=@{/code/listJson.do(page=1)}">분류 새로고침</button>
            <ul id="categoryItems"></ul>
            <p id="categoryStatus" role="status"></p>
        </div>
    </section>
</body>
</html>
