<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head>
    <title>게시글 상세</title>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            $('#deleteForm').on('submit', function (event) {
                event.preventDefault();
                var form = $(this);
                var button = form.find('button').prop('disabled', true);
                $.ajax({
                    url: /*[[@{/board/delete.do}]]*/ '/board/delete.do',
                    type: 'POST',
                    dataType: 'json',
                    data: form.serialize()
                }).done(function (result) {
                    if (result.success) {
                        window.location.href = /*[[@{/board/list.do}]]*/ '/board/list.do';
                    } else {
                        $('#deleteStatus').text('삭제하지 못했습니다.');
                    }
                }).fail(function () {
                    $('#deleteStatus').text('삭제에 실패했습니다. 로그인 상태와 권한을 확인하세요.');
                }).always(function () {
                    button.prop('disabled', false);
                });
            });
        });
    </script>
</head>
<body>
    <section layout:fragment="content">
        <h1 th:text="${board.title}"></h1>
        <p>작성자: <span th:text="${board.author}"></span> · 분류: <span th:text="${board.category}"></span></p>
        <pre th:text="${board.content}"></pre>
        <a th:href="@{/board/list.do}">목록</a>
        <div th:if="${session.loginUser.role == 'ADMIN'}">
            <a th:href="@{/board/form.do(id=${board.id})}">수정</a>
            <form id="deleteForm" method="post" th:action="@{/board/delete.do}">
                <input type="hidden" name="id" th:value="${board.id}">
                <input type="hidden" name="csrf" th:value="${session.csrf}">
                <button>삭제</button>
            </form>
            <p id="deleteStatus" role="status"></p>
        </div>
    </section>
</body>
</html>
